<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Edad</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="container" style="max-width: 450px;">
        <!-- Card de Bootstrap -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 class="mb-0">Verificador de Acceso</h4>
            </div>
            <div class="card-body p-4">
                <form id="ageForm">
                    <!-- Label y Campo de Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
                    </div>

                    <!-- Label y Campo de Edad -->
                    <div class="mb-3">
                        <label for="edad" class="form-label">Edad</label>
                        <input type="number" class="form-control" id="edad" placeholder="Ingresa tu edad" min="0" max="120" required>
                    </div>

                    <!-- Botón de Envío -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary">Verificar</button>
                    </div>

                    <!-- Label / Campo de Mensaje (inicialmente vacío y oculto/neutro) -->
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Estado de acceso:</label>
                        <!-- Usamos 'd-none' para que no se muestre el cuadro hasta que se verifique -->
                        <div id="mensaje" class="alert text-center mb-0 d-none" role="alert"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

  
    <script>
        const form = document.getElementById('ageForm');
        const mensajeDiv = document.getElementById('mensaje');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const edad = parseInt(document.getElementById('edad').value);

          
            mensajeDiv.classList.remove('d-none');

            if (edad >= 18, edad<=25) {
                mensajeDiv.className = "alert alert-success text-center mb-0";
                mensajeDiv.textContent = `¡Hola ${nombre}! eres estudiante bienvenido a la fiesta tienes hasta las 22 horas .`;
            } else {
                mensajeDiv.className = "alert alert-danger text-center mb-0";
                mensajeDiv.textContent = `Lo siento ${nombre}, tienes ${edad} años. No puedes pasar (eres menor de edad).`;
            }

            if(edad>=26, edad<=35){
                 mensajeDiv.className = "alert alert-success text-center mb-0";
                mensajeDiv.textContent = `¡Hola ${nombre}! eres oficinista  bienvenido a la fiesta tienes hasta las 00 horas .`;
            }

             if(edad>=35, edad<=45){
                 mensajeDiv.className = "alert alert-success text-center mb-0";
                mensajeDiv.textContent = `¡Hola ${nombre}!   bienvenido a la fiesta tienes hasta las 02 am horas .`;
            }
             if(edad>=45){
                 mensajeDiv.className = "alert alert-success text-center mb-0";
                mensajeDiv.textContent = `¡Hola ${nombre}  bienvenido a la fiesta tienes todo la noche .`;
            }


        });
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
