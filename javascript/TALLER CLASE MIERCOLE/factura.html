<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="factura.js" defer></script>
    <title>Document</title>
</head>
<body>
    <div class="container bg-primary p-3">
        <h2>Factura lico 5to</h2>
        
        <section>
            <div class="bg-warning p-2">
                <label>Cliente</label>
                <input type="text" id="nombreCliente">
                <label>Cedula</label>
                <input type="text" id="Cedula">
                <label>Sexo</label>
                <input type="text" id="sexoCliente">
            </div>
        </section>

        <section class="mt-3">
            <h4>Agregar productos</h4>
            <div class="bg-success p-2">
                <label>Producto</label>
                <input type="text" id="producto">
                <label>Cantidad</label>
                <input type="number" id="cantidad">
                <label>Precio</label>
                <input type="number" id="precio">
                <button id="agregar" class="btn btn-dark">Agregar producto</button>
            </div>
            
            <div class="mt-2">
                <h5>Lista de productos</h5>
                <table border="3" class="table table-striped table-dark">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="detalleFactura">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="mt-3">
            <table border="3" class="table table-striped table-dark">
                <thead>
                    <tr>
                        <th>Subtotal</th>
                        <th>IVA</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="totalFactura">
                </tbody>
            </table> 
        </section>
    </div>
</body>
</html>
